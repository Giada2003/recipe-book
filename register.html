<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrazione - PGRC</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-default navbar-custom">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="index.html">
          <img src="images/logo.png" alt="Logo" class="logo-img">
        </a>
      </div>
      <ul class="nav navbar-nav" id="main-navbar"></ul>
    </div>
  </nav>

  <div class="container auth-page-container auth-page-register">
    <div class="panel panel-default">
      <div class="panel-heading"><h3 class="panel-title text-center">Crea Account</h3></div>
      <div class="panel-body">
        <form id="registerForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUser" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPass" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Piatti Preferiti (separati da virgola)</label>
            <input type="text" id="regPref" class="form-control" placeholder="es. Pesce, Dolci, Pasta">
          </div>
          <button type="submit" class="btn btn-success btn-block">Registrati</button>
        </form>
        <p class="text-center auth-page-footer">
          <a href="index.html">Torna alla Home</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/pgrc-core.js"></script>
  <script src="js/ui-controller.js"></script>
</body>
</html>
