<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Registrazione - PGRC</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="margin-top: 50px; max-width: 500px;">
    <div class="panel panel-default">
      <div class="panel-heading"><h3 class="panel-title text-center">Crea Account</h3></div>
      <div class="panel-body">
        <form id="registerForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="regUser" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPass" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Piatti Preferiti (separati da virgola)</label>
            <input type="text" id="regPref" class="form-control" placeholder="es. Pesce, Dolci, Pasta">
          </div>
          <button type="submit" class="btn btn-success btn-block">Registrati</button>
        </form>
        <p class="text-center" style="margin-top: 15px;">
          <a href="index.html">Torna alla Home</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/pgrc-core.js"></script>
  <script src="js/ui-controller.js"></script>
</body>
</html>
