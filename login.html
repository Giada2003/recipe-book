<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - PGRC</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="images/logo.png" alt="Logo" class="logo-img">
      </a>
      <ul class="navbar-nav" id="main-navbar"></ul>
    </div>
  </nav>

  <div class="container auth-page-container auth-page-login">
    <div class="card panel-custom">
      <div class="card-header"><h3 class="card-title text-center">Accedi</h3></div>
      <div class="card-body">
        <form id="loginForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUser" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="text-center auth-page-footer">
          Non hai un account? <a href="register.html">Registrati</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/pgrc-core.js"></script>
  <script src="js/ui-controller.js"></script>
</body>
</html>
