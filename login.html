<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Login - PGRC</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="margin-top: 100px; max-width: 400px;">
    <div class="panel panel-default">
      <div class="panel-heading"><h3 class="panel-title text-center">Accedi</h3></div>
      <div class="panel-body">
        <form id="loginForm">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="loginUser" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="text-center" style="margin-top: 15px;">
          Non hai un account? <a href="register.html">Registrati</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/pgrc-core.js"></script>
  <script src="js/ui-controller.js"></script>
</body>
</html>
