<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PGRC - Home</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png" />

  <!-- CSS files -->
  <link rel="stylesheet" type="text/css" href="css/reset.css" />
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />
  <!-- Il file styles.css ora contiene le tue classi custom -->
  <link rel="stylesheet" type="text/css" href="css/styles.css" />

  <script charset="utf-8" type="text/javascript" src="js/modernizr.custom.js"></script>
</head>

<body>

  <!-- Header / Navigation Centrata -->
  <nav class="navbar navbar-default navbar-custom">
    <div class="container-fluid">

      <!-- LOGO -->
      <div class="navbar-header">
        <a class="navbar-brand" href="index.html">
          <img src="images/logo.png" alt="Logo" style="height: 40px; width: auto;">
        </a>
      </div>

      <!-- MENU (Si popola con JS) -->
      <ul class="nav navbar-nav" id="main-navbar"></ul>

    </div>
  </nav>

  <!-- Banner con Barra di Ricerca Centrata e Ingrandita -->
  <section id="hero-banner">
    <div class="banner-overlay"></div>
    <div class="container text-center">
      <form id="searchForm" class="search-container">

        <!-- Abbiamo sostituito lo stile inline con la classe search-flex -->
        <div class="search-flex">
          <input type="text" id="searchInput" placeholder="Cerca la tua ricetta preferita..." style="flex-grow: 1; border: none; outline: none;">
          <input type="hidden" id="searchType" value="name">
          <button type="submit" class="btn btn-default" style="border: none; outline: none;">
            <i class="fa fa-search"></i>
          </button>
        </div>

      </form>
    </div>
  </section>

  <!-- Griglia Ricette Pubbliche -->
  <div class="container">
    <div class="text-center" style="margin-top: 50px;">
      <h2 class="section-title">Esplora le Ricette</h2>
    </div>

    <div class="row" id="recipe-container">
        <div class="col-12 text-center" style="padding: 40px;">
            <i class="fa fa-spinner fa-spin fa-3x" style="color: #3baf36;"></i>
            <p style="margin-top: 15px; font-size: 18px; color: #666;">Caricamento ricette...</p>
        </div>
    </div>

    <div class="row" id="load-more-container" style="display: none; margin-top: 20px; margin-bottom: 50px;">
        <div class="col-12 text-center">
            <button id="loadMoreBtn" class="btn" style="background-color: #3baf36; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 25px; font-weight: bold; transition: all 0.3s;">
                Carica altre ricette <i class="fa fa-refresh" style="margin-left: 5px;"></i>
            </button>
        </div>
    </div>
  </div>

  <!-- JavaScript files -->
  <script charset="utf-8" src="js/jquery-3.3.1.min.js"></script>
  <script charset="utf-8" src="js/bootstrap.min.js"></script>
  <script src="js/pgrc-core.js"></script>
  <script src="js/ui-controller.js"></script>
  <script charset="utf-8" src="js/scripts.js"></script>

</body>
</html>
