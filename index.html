<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="images/logo.png" />

  <!-- CSS files -->
  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />
  <!-- Il file styles.css ora contiene le tue classi custom -->
  <link rel="stylesheet" type="text/css" href="css/styles.css" />
</head>

<body>

  <!-- Header / Navigation Centrata -->
  <nav class="navbar navbar-expand-md navbar-dark navbar-custom">
    <div class="container-fluid">

      <!-- LOGO -->
      <a class="navbar-brand" href="index.html">
        <img src="images/logo.png" alt="Logo" class="logo-img">
      </a>

      <!-- MENU (Si popola con JS) -->
      <ul class="navbar-nav" id="main-navbar"></ul>

    </div>
  </nav>

  <!-- Banner con Barra di Ricerca Centrata e Ingrandita -->
  <section id="hero-banner">
    <div class="banner-overlay"></div>
    <div class="container text-center">
      <form id="searchForm" class="search-container">

        <!-- Abbiamo sostituito lo stile inline con la classe search-flex -->
        <div class="search-flex">
          <select id="searchType" name="type" aria-label="Tipo di ricerca">
            <option value="name">Nome ricetta</option>
            <option value="ingredient">Ingrediente</option>
            <option value="description">Testo descrittivo</option>
            <option value="letter">Lettera iniziale</option>
          </select>
          <input type="text" id="searchInput" name="search" placeholder="Cerca una ricetta..." required>
          <button type="submit" class="btn btn-secondary search-submit-btn">
            <i class="fa fa-search"></i>
          </button>
        </div>

      </form>
    </div>
  </section>

  <!-- Griglia Ricette Pubbliche -->
  <div class="container">
    <div class="text-center homepage-title">
      <h2 class="section-title">Esplora le Ricette</h2>
    </div>

    <div class="row" id="recipe-container">
        <div class="col-12 text-center home-loading-state">
            <i class="fa fa-spinner fa-spin fa-3x loading-spinner"></i>
            <p class="loading-message">Caricamento ricette...</p>
        </div>
    </div>

    <div class="row load-more-container is-hidden" id="load-more-container">
        <div class="col-12 text-center">
            <button id="loadMoreBtn" class="btn load-more-btn">
                Carica altre ricette <i class="fa fa-refresh load-more-icon"></i>
            </button>
        </div>
    </div>
  </div>

  <!-- JavaScript files -->
  <script src="js/pgrc-core.js"></script>
  <script src="js/ui-controller.js"></script>

</body>
</html>
