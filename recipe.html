<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dettaglio Ricetta</title>

    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-default navbar-custom">
    <div class="container-fluid">
        <div class="navbar-header">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="Logo" class="logo-img">
            </a>
        </div>
        <ul class="nav navbar-nav" id="main-navbar"></ul>
    </div>
</nav>

<div class="container recipe-page">

    <!-- Contenitore della Ricetta -->
    <div class="row" id="recipe-details-container">
        <div class="col-12 text-center recipe-loading-state">
            <i class="fa fa-spinner fa-spin fa-3x loading-spinner"></i>
            <p class="loading-message">Preparazione ingredienti in corso...</p>
        </div>
    </div>

<!-- Le recensioni sono pubbliche; le note restano visibili solo all'utente autenticato. -->
    <div class="row recipe-interactions is-hidden" id="interactions-area">

        <div class="interaction-layout">

            <!-- Colonna Note Privata -->
            <div id="private-note-area" class="interaction-column private-note-area is-hidden">
                <div class="panel panel-custom interaction-panel private-note-panel">
                    <div class="panel-heading note-panel-heading">
                        <h3 class="panel-title interaction-panel-title">
                            <i class="fa fa-lock"></i> La tua Nota Privata
                        </h3>
                    </div>
                    <!-- Aggiunta classe interaction-panel-body per il padding -->
                    <div class="panel-body interaction-panel-body note-panel-body">
                        <div>
                            <textarea id="privateNoteInput" class="form-control private-note-input" rows="4" placeholder="Scrivi qui i tuoi appunti segreti sulla ricetta..."></textarea>
                        </div>
                        <div>
                            <button id="saveNoteBtn" class="btn btn-block btn-success interaction-btn save-note-button">Salva Nota</button>
                            <button id="deleteNoteBtn" type="button" class="btn btn-block btn-danger interaction-btn delete-note-button">Elimina nota</button>
                            <div class="text-center note-status-container">
                                <span id="noteStatus" class="text-success is-hidden"><i class="fa fa-check"></i> Salvata!</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Colonna Recensioni -->
            <div class="interaction-column">
                <div class="panel panel-custom interaction-panel review-panel">
                    <div class="panel-heading review-panel-heading">
                        <h3 class="panel-title interaction-panel-title">
                            <i class="fa fa-star review-star"></i> Recensioni
                        </h3>
                    </div>
                    <!-- Aggiunta classe interaction-panel-body per il padding -->
                    <div class="panel-body interaction-panel-body reviews-panel-body">
                        <div id="reviews-list" class="reviews-list"></div>

                        <div id="review-form-area" class="is-hidden">
                            <hr class="review-form-divider">
                            <form id="addReviewForm">
                                <div class="form-group">
                                    <label for="reviewDate" class="review-label">Data di preparazione del piatto</label>
                                    <input type="date" id="reviewDate" class="form-control review-date-input" required>
                                </div>
                                <div class="review-rating-row">
                                    <div class="review-rating-field">
                                        <label class="review-label">Difficoltà (1-5)</label>
                                        <select id="diffSelect" class="form-control review-rating-select" required>
                                            <option value="1">1 - Facilissima</option>
                                            <option value="2">2 - Facile</option>
                                            <option value="3">3 - Media</option>
                                            <option value="4">4 - Difficile</option>
                                            <option value="5">5 - Masterchef</option>
                                        </select>
                                    </div>
                                    <div class="review-rating-field">
                                        <label class="review-label">Gusto (1-5)</label>
                                        <select id="tasteSelect" class="form-control review-rating-select" required>
                                            <option value="1">1 - Pessimo</option>
                                            <option value="2">2 - Mediocre</option>
                                            <option value="3">3 - Buono</option>
                                            <option value="4">4 - Ottimo</option>
                                            <option value="5">5 - Delizioso</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-block interaction-btn review-submit-button">Aggiungi Recensione</button>
                            </form>
                        </div>
                        <p id="review-login-prompt" class="is-hidden">Per pubblicare una recensione, <a href="login.html">accedi</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/pgrc-core.js"></script>
<script src="js/ui-controller.js"></script>

</body>
</html>
